name: ci
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn verify
      - name: Start api and web
        run: |
          yarn db:migrate
          yarn db:seed
          nohup yarn dev > .logs-dev.txt 2>&1 &
          yarn wait-on -t 60000 http-get://localhost:3000/health http-get://localhost:5174
      - run: yarn workspace @caqui-chatbot/web exec playwright install --with-deps chromium
      - run: yarn e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            .logs-dev.txt
